<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Kristall Simon</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg1:#dfe9ff;--bg2:#f6dcff;--bg3:#d4fff1;
  --ink:#1c2340;--ink2:#4a5280;
  --glass-edge:rgba(255,255,255,.85);--glass-fill:.38;
  --plate:rgba(255,255,255,.45);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#0c1130;--bg2:#2a1450;--bg3:#07302f;
    --ink:#eef1ff;--ink2:#a9b1dd;
    --glass-edge:rgba(255,255,255,.55);--glass-fill:.3;
    --plate:rgba(255,255,255,.08);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg1:#0c1130;--bg2:#2a1450;--bg3:#07302f;
  --ink:#eef1ff;--ink2:#a9b1dd;
  --glass-edge:rgba(255,255,255,.55);--glass-fill:.3;
  --plate:rgba(255,255,255,.08);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(40vmax 40vmax at 15% 20%,var(--bg2),transparent 60%),
    radial-gradient(45vmax 45vmax at 85% 80%,var(--bg3),transparent 60%),
    var(--bg1);
  display:flex;overflow-x:hidden;overflow-y:auto;
}
.app{width:min(92vw,460px);text-align:center;padding:12px;margin:auto}
h1{font-size:clamp(28px,7vw,40px);font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--ink2);margin:0 0 18px;min-height:1.4em;font-weight:500}
.hud{display:flex;gap:12px;justify-content:center;margin-bottom:22px}
.chip{
  padding:8px 18px;border-radius:999px;background:var(--plate);
  border:1px solid var(--glass-edge);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  font-weight:700;font-size:15px;
}
.chip b{font-size:18px;margin-left:6px}
.stage{perspective:900px;perspective-origin:50% 30%;padding:10px 0 26px}
.pad{
  display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,4vw,20px);
  transform:rotateX(24deg);transform-style:preserve-3d;
  padding:clamp(14px,4vw,22px);border-radius:34px;
  background:var(--plate);border:1px solid var(--glass-edge);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 40px 60px -20px rgba(20,20,60,.45),inset 0 1px 0 var(--glass-edge);
}
.key{
  --c:#ff5d73;--depth:14px;
  position:relative;aspect-ratio:1;border:0;border-radius:26px;cursor:pointer;
  font:inherit;font-size:clamp(24px,7vw,34px);font-weight:800;color:#fff;
  background:
    linear-gradient(155deg,rgba(255,255,255,.55),rgba(255,255,255,0) 45%),
    color-mix(in srgb,var(--c) calc(var(--glass-fill)*100%),transparent);
  border:1.5px solid var(--glass-edge);
  backdrop-filter:blur(8px) saturate(1.6);-webkit-backdrop-filter:blur(8px) saturate(1.6);
  box-shadow:
    0 var(--depth) 0 -2px color-mix(in srgb,var(--c) 70%,#000),
    0 calc(var(--depth) + 14px) 26px color-mix(in srgb,var(--c) 55%,transparent),
    inset 0 2px 3px rgba(255,255,255,.9),
    inset 0 -14px 24px color-mix(in srgb,var(--c) 55%,transparent);
  transform:translateZ(18px);
  transition:transform .09s ease,box-shadow .09s ease,filter .09s ease;
  text-shadow:0 2px 6px rgba(0,0,0,.35);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.key::before{
  content:"";position:absolute;left:12%;right:12%;top:7%;height:30%;border-radius:20px 20px 60% 60%/20px 20px 40% 40%;
  background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,0));pointer-events:none;
}
.key:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.key.on,.key:active:not(:disabled){
  --depth:3px;transform:translateZ(6px) translateY(10px);
  filter:brightness(1.35) saturate(1.3);
  box-shadow:
    0 3px 0 -2px color-mix(in srgb,var(--c) 70%,#000),
    0 0 46px 8px var(--c),
    inset 0 2px 3px rgba(255,255,255,.9),
    inset 0 -14px 24px color-mix(in srgb,var(--c) 80%,transparent);
}
.key:disabled{cursor:default}
.k1{--c:#ff5d73}.k2{--c:#ffb627}.k3{--c:#22d3a6}.k4{--c:#8b6bff}
.go{
  margin-top:8px;padding:14px 36px;font:inherit;font-size:18px;font-weight:700;color:var(--ink);
  border-radius:999px;cursor:pointer;background:var(--plate);
  border:1.5px solid var(--glass-edge);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 8px 0 -2px rgba(90,100,160,.45),0 16px 28px rgba(20,20,60,.25),inset 0 2px 2px rgba(255,255,255,.8);
  transition:transform .09s,box-shadow .09s;
}
.go:active{transform:translateY(6px);box-shadow:0 2px 0 -2px rgba(90,100,160,.45),inset 0 2px 2px rgba(255,255,255,.8)}
.go:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.shake{animation:sh .4s}
@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
[hidden]{display:none!important}
body.online #go{display:none!important}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--plate);border:1px solid var(--glass-edge);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin-bottom:14px}
.tab{font:inherit;font-weight:700;font-size:15px;color:var(--ink2);border:0;background:transparent;padding:8px 22px;border-radius:999px;cursor:pointer}
.tab.sel{color:#1c2340;background:var(--glass-edge);box-shadow:0 2px 8px rgba(20,20,60,.25)}
.tab:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.online{display:grid;gap:10px;margin-bottom:16px}
.row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.row label{font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:8px}
.row input{font:inherit;font-weight:700;color:var(--ink);width:84px;padding:10px 12px;text-align:center;border-radius:14px;background:var(--plate);border:1.5px solid var(--glass-edge);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.row input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.go.sm{margin:0;padding:10px 22px;font-size:15px}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.key,.go{transition:none}}
</style>
</head>
<body>
<main class="app">
  <h1>Kristall Simon</h1>
  <div class="tabs"><button class="tab sel" id="tSolo">Yakka</button><button class="tab" id="tOn">Onlayn</button></div>
  <p class="sub" id="msg">Tugmalar yonish tartibini eslab qoling.</p>
  <div class="hud">
    <div class="chip">Bosqich<b id="lvl">0</b></div>
    <div class="chip">Rekord<b id="best">0</b></div>
  </div>
  <div class="online" id="online" hidden>
    <div class="row"><label>Tugmalar soni <input id="nIn" type="number" min="2" max="12" value="5"></label><button class="go sm" id="mk">Xona yaratish</button></div>
    <div class="row"><input id="codeIn" maxlength="4" placeholder="Kod" autocomplete="off"><button class="go sm" id="jn">Xonaga qo‘shilish</button></div>
  </div>
  <div class="stage"><div class="pad" id="pad">
    <button class="key k1" data-i="0" aria-label="Qizil tugma" disabled>1</button>
    <button class="key k2" data-i="1" aria-label="Sariq tugma" disabled>2</button>
    <button class="key k3" data-i="2" aria-label="Yashil tugma" disabled>3</button>
    <button class="key k4" data-i="3" aria-label="Binafsha tugma" disabled>4</button>
  </div></div>
  <button class="go sm" id="again" hidden>Qayta o‘ynash</button>
  <button class="go" id="go">O‘yinni boshlash</button>
</main>
<script>
(function(){
  var keys=[].slice.call(document.querySelectorAll('.key'));
  var msg=document.getElementById('msg'),lvl=document.getElementById('lvl'),
      bestEl=document.getElementById('best'),go=document.getElementById('go'),pad=document.getElementById('pad');
  var seq=[],pos=0,busy=false,playing=false,best=0,ac=null;
  var freqs=[329.6,415.3,523.3,659.3];
  try{best=parseInt(localStorage.getItem('ks-best'),10)||0}catch(e){}
  bestEl.textContent=best;
  window.__soloStop=function(){playing=false;busy=false;seq=[];lvl.textContent=0;go.hidden=false;go.textContent='O‘yinni boshlash';msg.textContent='Tugmalar yonish tartibini eslab qoling.'};

  function tone(i,ms){
    try{
      ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      var o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=freqs[i];
      g.gain.setValueAtTime(.0001,ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.25,ac.currentTime+.02);
      g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+ms/1000);
      o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+ms/1000+.05);
    }catch(e){}
  }
  function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
  function flash(i,ms){
    keys[i].classList.add('on');tone(i,ms);
    return wait(ms).then(function(){keys[i].classList.remove('on')});
  }
  function setLocked(v){keys.forEach(function(k){k.disabled=v})}

  async function playSeq(){
    busy=true;setLocked(true);msg.textContent='Diqqat bilan qarang…';
    var speed=Math.max(240,520-seq.length*22);
    await wait(500);
    for(var n=0;n<seq.length;n++){await flash(seq[n],speed);await wait(speed*.45)}
    pos=0;busy=false;setLocked(false);msg.textContent='Endi sizning navbatingiz!';
  }
  function next(){
    seq.push(Math.floor(Math.random()*4));
    lvl.textContent=seq.length;playSeq();
  }
  function lose(){
    playing=false;setLocked(true);
    pad.classList.remove('shake');void pad.offsetWidth;pad.classList.add('shake');
    if(seq.length-1>best){
      best=seq.length-1;bestEl.textContent=best;
      try{localStorage.setItem('ks-best',best)}catch(e){}
    }
    msg.textContent='Xato! Natijangiz: '+(seq.length-1)+' bosqich.';
    go.textContent='Qayta o‘ynash';go.hidden=false;
  }
  function press(i){
    if(!playing||busy)return;
    flash(i,180);
    if(i!==seq[pos]){lose();return}
    pos++;
    if(pos===seq.length){
      busy=true;setLocked(true);msg.textContent='Zo‘r! Keyingi bosqich…';
      setTimeout(next,700);
    }
  }
  keys.forEach(function(k){k.addEventListener('click',function(){press(+k.dataset.i)})});
  document.addEventListener('keydown',function(e){
    var i='1234'.indexOf(e.key);
    if(i>-1&&!e.repeat)press(i);
  });
  go.addEventListener('click',function(){
    seq=[];playing=true;go.hidden=true;lvl.textContent=0;next();
  });
})();
</script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var keys=[].slice.call(document.querySelectorAll('.key')),msg=$('msg'),lvl=$('lvl'),pad=$('pad'),
      tSolo=$('tSolo'),tOn=$('tOn'),panel=$('online'),mk=$('mk'),jn=$('jn'),nIn=$('nIn'),codeIn=$('codeIn'),again=$('again');
  var cap=null,r=null,role=null,n=5,seq=[],pos=0,turn='A',over=true,final=false,paired=false,hello=null,offs=[],ac=null;
  var freqs=[329.6,415.3,523.3,659.3];
  function tone(i,ms){
    try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=freqs[i];
      g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.25,ac.currentTime+.02);
      g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+ms/1000);
      o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+ms/1000+.05);}catch(e){}
  }
  function flash(i,ms){keys[i].classList.add('on');tone(i,ms);setTimeout(function(){keys[i].classList.remove('on')},ms)}
  function lock(v){keys.forEach(function(k){k.disabled=v})}
  function my(){return !over&&turn===role}
  function ui(){
    lvl.textContent=seq.length+'/'+n;lock(!my());
    if(over)return;
    msg.textContent=my()?(seq.length?'Sizning navbatingiz: '+seq.length+' ta tugmani takrorlang, keyin yangisini qo‘shing.':'Sizning navbatingiz: birinchi tugmani tanlang.'):'Raqib o‘ynayapti. Bosilgan tugmalarni eslab qoling.';
  }
  function shake(){pad.classList.remove('shake');void pad.offsetWidth;pad.classList.add('shake')}
  function finish(t){over=true;lock(true);msg.textContent=t+(role==='B'?' Host qayta boshlashini kuting.':'');again.hidden=role!=='A'}
  function begin(){seq=[];pos=0;turn='A';final=false;over=false;again.hidden=true;ui()}
  function sendCfg(){if(!r)return;r.emit('cfg',{n:n});paired=true;begin()}
  function leave(){
    offs.forEach(function(f){try{f()}catch(e){}});offs=[];clearInterval(hello);
    if(r){try{r.leave()}catch(e){}}
    r=null;role=null;over=true;paired=false;again.hidden=true;
  }
  async function getCap(){
    if(cap!==null)return cap;
    try{cap=(window.claude&&await window.claude.use('room'))||false}catch(e){cap=false}
    return cap;
  }
  async function enter(code,host){
    var R=await getCap();if(!R){msg.textContent='Onlayn rejim bu yerda mavjud emas.';return}
    leave();
    try{r=await R.join('ks-'+code)}catch(e){r=null;msg.textContent='Xonaga ulanib bo‘lmadi. Qayta urinib ko‘ring.';return}
    role=host?'A':'B';over=true;
    offs.push(r.on('hello',function(m){if(m.isMe||role!=='A'||paired)return;sendCfg()}));
    offs.push(r.on('cfg',function(m){
      if(m.isMe||role!=='B')return;
      var k=m.data&&parseInt(m.data.n,10);if(!(k>=2&&k<=12))return;
      n=k;clearInterval(hello);begin();
    }));
    offs.push(r.on('press',function(m){
      if(m.isMe||over||my())return;
      var i=m.data&&m.data.i;if(i===0||i===1||i===2||i===3)flash(i,260);
    }));
    offs.push(r.on('done',function(m){
      if(m.isMe||over)return;
      var s=m.data&&m.data.seq;
      if(!Array.isArray(s)||s.length>60||!s.every(function(x){return x===0||x===1||x===2||x===3}))return;
      seq=s;turn=role;pos=0;final=seq.length>=n;ui();
    }));
    offs.push(r.on('lose',function(m){if(m.isMe||over)return;finish('Raqib xato qildi. Siz yutdingiz! 🎉')}));
    offs.push(r.on('draw',function(m){if(m.isMe||over)return;finish('Durang! Ikkalangiz ham ketma-ketlikni oxirigacha eslab qoldingiz.')}));
    if(host){msg.textContent='Xona kodi: '+code.toUpperCase()+'. Raqibni kuting…'}
    else{msg.textContent='Ulanilmoqda…';var send=function(){if(r)r.emit('hello',{})};send();hello=setInterval(send,2000)}
  }
  keys.forEach(function(k){k.addEventListener('click',function(){
    if(!r||!my())return;
    var i=+k.dataset.i;flash(i,200);r.emit('press',{i:i});
    if(pos<seq.length){
      if(i!==seq[pos]){r.emit('lose',{});shake();finish('Xato! Siz yutqazdingiz.');return}
      pos++;
      if(pos===seq.length){
        if(final){r.emit('draw',{});finish('Durang! Ikkalangiz ham ketma-ketlikni oxirigacha eslab qoldingiz.');return}
        msg.textContent='Ajoyib! Endi yangi tugmani qo‘shing.';
      }
    }else{
      seq.push(i);r.emit('done',{seq:seq});turn=role==='A'?'B':'A';pos=0;ui();
    }
  })});
  document.addEventListener('keydown',function(e){
    if(!document.body.classList.contains('online')||e.repeat)return;
    var i='1234'.indexOf(e.key);if(i>-1&&!keys[i].disabled)keys[i].click();
  });
  function setMode(on){
    document.body.classList.toggle('online',on);
    tSolo.classList.toggle('sel',!on);tOn.classList.toggle('sel',on);panel.hidden=!on;
    if(window.__soloStop)window.__soloStop();
    leave();lock(true);lvl.textContent=0;
    if(on){
      msg.textContent='Tugmalar sonini kiriting va xona yarating, yoki do‘stingizning kodini yozing.';
      getCap().then(function(x){if(!x){msg.textContent='Onlayn rejim bu yerda mavjud emas: sahifaga kirgan va taklif qilingan foydalanuvchilar o‘ynay oladi.';mk.disabled=true;jn.disabled=true}});
    }
  }
  tSolo.addEventListener('click',function(){setMode(false)});
  tOn.addEventListener('click',function(){setMode(true)});
  mk.addEventListener('click',function(){
    var v=parseInt(nIn.value,10);n=Math.min(12,Math.max(2,isNaN(v)?5:v));nIn.value=n;lvl.textContent='0/'+n;
    var a='abcdefghjkmnpqrstuvwxyz23456789',c='';for(var i=0;i<4;i++)c+=a[Math.floor(Math.random()*a.length)];
    enter(c,true);
  });
  jn.addEventListener('click',function(){
    var c=codeIn.value.trim().toLowerCase();
    if(!/^[a-z0-9]{4}$/.test(c)){msg.textContent='Kod 4 ta harf yoki raqamdan iborat bo‘lishi kerak.';return}
    enter(c,false);
  });
  again.addEventListener('click',function(){if(role==='A')sendCfg()});
})();
</script>
</body>
</html>
